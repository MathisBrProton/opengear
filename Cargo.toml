[workspace]
resolver = "2"
members = [
    "crates/opengear-core",
    "crates/opengear-platform",
    "crates/opengear-corsair",
    "crates/opengear-asus",
    "crates/opengear-logitech",
    "crates/opengear-hp",
    "crates/opengear-input",
    "crates/opengear-app",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["OpenGear Contributors"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
tao = "0.33"
wry = "0.51"
libloading = "0.8"
libc = "0.2"
sha2 = "0.10"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }

opengear-core = { path = "crates/opengear-core" }
opengear-platform = { path = "crates/opengear-platform" }
opengear-hp = { path = "crates/opengear-hp" }
opengear-corsair = { path = "crates/opengear-corsair" }
opengear-asus = { path = "crates/opengear-asus" }
opengear-logitech = { path = "crates/opengear-logitech" }
opengear-input = { path = "crates/opengear-input" }
