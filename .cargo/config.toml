# Portable build configuration (no machine-specific paths).
# Target: x86_64-pc-windows-gnullvm, linked with the rust-lld shipped in the Rust toolchain,
# fully static CRT -> a single OpenGear.exe (+ WebView2Loader.dll) with no MSVC / MinGW install.
[build]
target = "x86_64-pc-windows-gnullvm"

[target.x86_64-pc-windows-gnullvm]
linker = "rust-lld"
rustflags = [
    "-C", "linker-flavor=ld.lld",
    "-C", "link-self-contained=yes",
    "-C", "target-feature=+crt-static",
]
