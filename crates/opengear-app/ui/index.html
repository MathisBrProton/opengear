<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenGear — Command Center</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="app-shell">
    <!-- LEFT NAVIGATION RAIL -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 28 28" fill="none">
            <rect x="1" y="1" width="26" height="26" rx="7" fill="url(#ogGrad)" fill-opacity="0.14" stroke="url(#ogGrad)" stroke-width="1.5"/>
            <path d="M15.8 5.5L8.6 15.2H14L12.2 22.5L19.4 12.8H14L15.8 5.5Z" fill="url(#ogGrad)"/>
            <defs>
              <linearGradient id="ogGrad" x1="2" y1="2" x2="26" y2="26" gradientUnits="userSpaceOnUse">
                <stop stop-color="#00D4FF"/>
                <stop offset="1" stop-color="#3B82F6"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">OpenGear</span>
          <span class="brand-sub">COMMAND CENTER</span>
        </div>
      </div>

      <div class="nav-section-label">SYSTÈME & MATÉRIEL</div>
      <nav class="nav-list" id="nav-list">
        <button class="nav-item active" data-tab="dashboard">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="2.5" width="6" height="6" rx="1.5"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.5"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.5"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.5"/></svg>
          <span>Tableau de bord</span>
        </button>
        <button class="nav-item" data-tab="asus" data-accent="rog">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4.5" y="4.5" width="11" height="11" rx="2"/><rect x="7.5" y="7.5" width="5" height="5" rx="0.8" fill="currentColor" stroke="none"/><path d="M7.5 2v2.5M12.5 2v2.5M7.5 15.5V18M12.5 15.5V18M2 7.5h2.5M2 12.5h2.5M15.5 7.5H18M15.5 12.5H18"/></svg>
          <span>ASUS ROG Aura</span>
          <span class="nav-badge" id="badge-asus"></span>
        </button>
        <button class="nav-item" data-tab="cooling" data-accent="amber">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7.5"/><circle cx="10" cy="10" r="1.8" fill="currentColor"/><path d="M10 8.2C10 5.5 12.5 4 14 5.5M11.8 10C14.5 10 16 12.5 14.5 14M10 11.8C10 14.5 7.5 16 6 14.5M8.2 10C5.5 10 4 7.5 5.5 6"/></svg>
          <span>Silent Loop 3 &amp; Fans</span>
          <span class="nav-badge" id="badge-cooling"></span>
        </button>
        <button class="nav-item" data-tab="corsair" data-accent="cyan">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="5" width="16" height="10" rx="2"/><path d="M5 8.5h1M8 8.5h1M11 8.5h1M14 8.5h1M6 12h8" stroke-linecap="round"/></svg>
          <span>Corsair Bragi</span>
          <span class="nav-badge" id="badge-corsair"></span>
        </button>
        <button class="nav-item" data-tab="logitech" data-accent="cyan">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="2.5" width="10" height="15" rx="5"/><path d="M10 6v3" stroke-linecap="round" stroke-width="2"/><path d="M5.5 9h9" opacity="0.45"/></svg>
          <span>Logitech G</span>
          <span class="nav-badge" id="badge-logi"></span>
        </button>
        <button class="nav-item" data-tab="macros" data-accent="purple">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke-linecap="round"/><circle cx="7" cy="5.5" r="2" fill="currentColor"/><circle cx="13.5" cy="10" r="2" fill="currentColor"/><circle cx="9" cy="14.5" r="2" fill="currentColor"/></svg>
          <span>Esports, SOCD &amp; Macros</span>
          <span class="nav-badge" id="badge-macros"></span>
        </button>
        <button class="nav-item" data-tab="devices" data-accent="emerald">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="16" r="1.8" fill="currentColor"/><path d="M10 14.2V4.5M10 10.5L5.5 7.5M10 10.5L14.5 7.5"/><circle cx="5" cy="7" r="1.4" fill="currentColor"/><circle cx="15" cy="7" r="1.4" fill="currentColor"/><circle cx="10" cy="4" r="1.4" fill="currentColor"/></svg>
          <span>Mon Setup (HID)</span>
        </button>
      </nav>

      <div class="sidebar-divider"></div>

      <div class="profile-box">
        <div class="nav-section-label">PROFIL ACTIF</div>
        <select id="profile-select" class="og-select"></select>
        <div class="profile-actions">
          <button id="btn-save-cfg" class="btn btn-secondary btn-sm">Sauver</button>
          <button id="btn-rescan" class="btn btn-secondary btn-sm">Rescanner</button>
        </div>
        <div class="profile-actions" style="margin-top:6px">
          <button id="btn-export-prof" class="btn btn-secondary btn-sm" title="Exporter le profil actif en JSON">Exporter</button>
          <button id="btn-import-prof" class="btn btn-secondary btn-sm" title="Importer un profil JSON">Importer</button>
        </div>
        <div class="profile-create">
          <input id="new-profile-input" class="og-input" placeholder="Nouveau profil..." />
          <button id="btn-add-profile" class="btn btn-secondary btn-icon" title="Créer le profil">+</button>
        </div>
      </div>

      <div class="sidebar-footer">
        <label class="mini-check">
          <input type="checkbox" id="chk-azerty" checked />
          <span>Clavier AZERTY FR</span>
        </label>
        <div class="version-line">OpenGear v0.8 • PawnIO Universal</div>
      </div>
    </aside>

    <!-- MAIN CONTENT WORKSPACE -->
    <div class="workspace">
      <main class="main-scroll" id="main-content">
        <div class="loading-stage">
          <div class="spinner"></div>
          <div>Connexion aux contrôleurs matériels…</div>
        </div>
      </main>

      <!-- SUBTLE FOOTER STATUS BAR -->
      <footer class="status-bar">
        <div class="status-left">
          <span class="status-dot"></span>
          <span id="status-text">Initialisation OpenGear…</span>
        </div>
        <div class="status-right">
          <span id="footer-tel-mini"></span>
          <span class="sep">•</span>
          <span>Zéro bloat • Zéro télémétrie</span>
        </div>
      </footer>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast-root" class="toast-root"></div>

  <script src="/app.js"></script>
</body>
</html>
