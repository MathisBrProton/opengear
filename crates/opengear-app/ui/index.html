<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenGear — Command Center</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="app-shell">
    <!-- NAVIGATION PAR FONCTION -->
    <aside class="sidebar" aria-label="Navigation principale">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 28 28" fill="none">
            <rect x="1" y="1" width="26" height="26" rx="7" fill="url(#ogGrad)" fill-opacity="0.14" stroke="url(#ogGrad)" stroke-width="1.5"/>
            <path d="M15.8 5.5L8.6 15.2H14L12.2 22.5L19.4 12.8H14L15.8 5.5Z" fill="url(#ogGrad)"/>
            <defs>
              <linearGradient id="ogGrad" x1="2" y1="2" x2="26" y2="26" gradientUnits="userSpaceOnUse">
                <stop stop-color="#00D4FF"/>
                <stop offset="1" stop-color="#3B82F6"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">OpenGear</span>
          <span class="brand-sub">COMMAND CENTER</span>
        </div>
      </div>

      <nav class="nav-list" id="nav-list">
        <button type="button" class="nav-item active" data-act="nav" data-tab="home">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 9.2L10 3.5l7 5.7V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1V9.2z" stroke-linejoin="round"/></svg>
          <span>Accueil</span>
        </button>
        <button type="button" class="nav-item" data-act="nav" data-tab="lighting">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M10 2.5a5 5 0 0 0-3 9v2h6v-2a5 5 0 0 0-3-9z" stroke-linejoin="round"/><path d="M7.5 16h5M8.5 18h3" stroke-linecap="round"/></svg>
          <span>Éclairage</span>
        </button>
        <button type="button" class="nav-item" data-act="nav" data-tab="performance">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 14a7 7 0 1 1 14 0" stroke-linecap="round"/><path d="M10 14l3.5-4.5" stroke-linecap="round"/><circle cx="10" cy="14" r="1.4" fill="currentColor"/></svg>
          <span>Performances</span>
        </button>
        <button type="button" class="nav-item" data-act="nav" data-tab="input">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="5" width="16" height="10" rx="2"/><path d="M5 8.5h1M8 8.5h1M11 8.5h1M14 8.5h1M6 12h8" stroke-linecap="round"/></svg>
          <span>Touches &amp; Macros</span>
        </button>
        <button type="button" class="nav-item" data-act="nav" data-tab="profiles">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="14" height="4" rx="1.2"/><rect x="3" y="8.5" width="14" height="4" rx="1.2"/><rect x="3" y="14" width="9" height="3" rx="1.2"/></svg>
          <span>Profils</span>
        </button>
        <button type="button" class="nav-item" data-act="nav" data-tab="devices">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="2.5" width="10" height="15" rx="5"/><path d="M10 6v3" stroke-linecap="round" stroke-width="2"/></svg>
          <span>Appareils</span>
          <span class="nav-badge" id="badge-devices"></span>
        </button>
        <button type="button" class="nav-item" data-act="nav" data-tab="system">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" stroke-linecap="round"/></svg>
          <span>Système</span>
          <span class="nav-badge" id="badge-system"></span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div class="side-block">
          <label class="nav-section-label" for="profile-select">Profil actif</label>
          <select id="profile-select" class="og-select" data-change="switch-profile"></select>
        </div>
        <div class="side-block">
          <div class="nav-section-label" id="mode-label">Mode d'affichage</div>
          <div class="mode-toggle" role="group" aria-labelledby="mode-label">
            <button type="button" class="mode-btn" data-act="set-mode" data-mode="simple" id="mode-simple" aria-pressed="false">Simple</button>
            <button type="button" class="mode-btn" data-act="set-mode" data-mode="expert" id="mode-expert" aria-pressed="false">Expert</button>
          </div>
          <div class="mode-hint" id="mode-hint"></div>
        </div>
        <div class="version-line" id="app-version">OpenGear · aucune télémétrie</div>
      </div>
    </aside>

    <!-- ESPACE DE TRAVAIL -->
    <div class="workspace">
      <main class="main-scroll" id="main-content" tabindex="-1">
        <div class="loading-stage" role="status">
          <div class="spinner"></div>
          <div>Connexion aux contrôleurs matériels…</div>
        </div>
      </main>

      <footer class="status-bar">
        <div class="status-left">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text" aria-live="polite">Initialisation d'OpenGear…</span>
        </div>
        <div class="status-right">
          <button type="button" class="status-undo" id="btn-undo" data-act="undo" hidden>Annuler la dernière modification</button>
          <span id="footer-tel-mini"></span>
        </div>
      </footer>
    </div>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="/app.js"></script>
</body>
</html>
