name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test & lint (Windows)
    runs-on: windows-latest
    env:
      # rust-toolchain.toml pins a host-qualified channel (1.99.1-x86_64-pc-windows-gnu) for local
      # builds without MSVC; recent rustup rejects that form, so CI uses the same Rust version on
      # the runner's default (MSVC) host. The build target stays x86_64-pc-windows-gnullvm.
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal \
            --target x86_64-pc-windows-gnullvm --component clippy
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --locked
        continue-on-error: true

      - name: Upload OpenGear.exe
        uses: actions/upload-artifact@v4
        with:
          name: OpenGear-${{ github.sha }}
          path: |
            target/x86_64-pc-windows-gnullvm/release/opengear.exe
            target/x86_64-pc-windows-gnullvm/release/WebView2Loader.dll
          if-no-files-found: warn
