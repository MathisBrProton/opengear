name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test & lint (Windows)
    runs-on: windows-latest
    env:
      # Same toolchain as the developer machine (GNU host, no MSVC needed). Recent rustup rejects
      # this host-qualified name inside rust-toolchain.toml, but accepts it as an explicit override.
      RUSTUP_TOOLCHAIN: "1.99.1-x86_64-pc-windows-gnu"
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal \
            --target x86_64-pc-windows-gnullvm --component clippy --component rustfmt
          # Self-contained MinGW import libraries (kernel32, msvcrt, unwind...) that rust-lld links
          # against for the gnullvm target. Only offered by GNU-host toolchains.
          rustup component add rust-mingw --target x86_64-pc-windows-gnullvm \
            --toolchain 1.99.1-x86_64-pc-windows-gnu
          rustc --version --verbose

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Unit tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build (release)
        run: cargo build --release --locked

      - name: Stage & build setup installer
        shell: bash
        run: |
          mkdir -p dist/stage/pawnio_modules
          cp target/x86_64-pc-windows-gnullvm/release/opengear.exe dist/stage/OpenGear.exe
          cp target/x86_64-pc-windows-gnullvm/release/WebView2Loader.dll dist/stage/WebView2Loader.dll
          cp target/x86_64-pc-windows-gnullvm/release/pawnio_modules/* dist/stage/pawnio_modules/
          cargo build --release --manifest-path tools/opengear-setup/Cargo.toml --locked

      - name: Upload OpenGear artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenGear-${{ github.sha }}
          path: |
            target/x86_64-pc-windows-gnullvm/release/opengear.exe
            target/x86_64-pc-windows-gnullvm/release/WebView2Loader.dll
            target/x86_64-pc-windows-gnullvm/release/pawnio_modules/*
            tools/opengear-setup/target/x86_64-pc-windows-gnullvm/release/opengear-setup.exe
          if-no-files-found: warn
