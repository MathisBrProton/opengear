name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test & lint (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml (channel + gnullvm target) on first cargo call.
      - name: Install toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --locked
        continue-on-error: true

      - name: Upload OpenGear.exe
        uses: actions/upload-artifact@v4
        with:
          name: OpenGear-${{ github.sha }}
          path: |
            target/x86_64-pc-windows-gnullvm/release/opengear.exe
            target/x86_64-pc-windows-gnullvm/release/WebView2Loader.dll
          if-no-files-found: warn
